
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: memcli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memcli}
      POSTGRES_USER: ${POSTGRES_USER:-memcli_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - memcli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memcli_user} -d ${POSTGRES_DB:-memcli}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  memcli_pgdata:
