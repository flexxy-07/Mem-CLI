[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memcli"
version = "0.1.0"
description = "A CLI-based long-term memory store powered by PostgreSQL and pgvector"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sumit" }
]
dependencies = [
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "python-dotenv>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
]

[project.scripts]
memcli = "memcli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

